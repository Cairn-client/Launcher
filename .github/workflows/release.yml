name: Release

# A release is a bare X.Y.Z tag on main. The tag must equal VERSION and be a single valid bump of the previous release.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Tag must be on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on main" }

      - name: Versioning policy
        shell: pwsh
        run: ./tools/Test-VersionPolicy.ps1 -Tag $env:GITHUB_REF_NAME

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (runs every test gate)
        shell: pwsh
        run: |
          ./tools/Build-Installer.ps1
          if (-not (Test-Path "release/Cairn-Setup-$env:GITHUB_REF_NAME.exe")) { throw "installer missing" }

      - name: The published master server works (it is trimmed, so a build that passes can still fail at run time)
        shell: pwsh
        run: ./tools/Test-MasterServer.ps1 -Dir release/Cairn/MasterServer

      - name: Changelog
        shell: pwsh
        run: ./tools/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "release/Cairn-Setup-$env:GITHUB_REF_NAME.exe" --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag

      # The launcher asks for this file to see whether a newer release is out. A plain download has no hourly limit, unlike api.github.com
      # (60 requests an hour for one address, used up by a few launches on a shared connection).
      # The repository is named Launcher, but launchers up to 0.3.38 only accept download addresses that start with the old lower-case name (a
      # case-sensitive check); GitHub redirects the old spelling, so the manifest keeps it. Newer launchers compare without case.
      - name: Update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          $exe = "release/Cairn-Setup-$env:GITHUB_REF_NAME.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($a in $rel.assets) { if ($a.name -eq (Split-Path $exe -Leaf)) { $a | Add-Member -NotePropertyName digest -NotePropertyValue "sha256:$hash" -Force } }
          $one = [pscustomobject]@{ tag_name = $rel.tag_name; html_url = $rel.html_url; body = $rel.body; draft = $false; assets = @($rel.assets | ForEach-Object { [pscustomobject]@{ name = $_.name; browser_download_url = ($_.browser_download_url -replace '/Cairn-client/Launcher/', '/Cairn-client/launcher/'); size = $_.size; digest = $_.digest } }) }
          ConvertTo-Json -InputObject @($one) -Depth 6 | Set-Content -Encoding utf8 update.json
          gh release upload $env:GITHUB_REF_NAME update.json --clobber
