name: CI

on:
  push:
    branches: [main, rust]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Versioning policy
        shell: pwsh
        run: ./tools/Test-VersionPolicy.ps1

  master-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build the master server
        run: dotnet build Cairn.sln -c Release --nologo -v q
      - name: Unit tests
        run: dotnet test dotnet/Cairn.MasterServer.Tests/Cairn.MasterServer.Tests.csproj -c Release --nologo -v q

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  installer:
    runs-on: windows-latest
    needs: [rust, master-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: The installer builds (nothing is published)
        shell: pwsh
        run: |
          ./tools/Build-Installer.ps1
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if (-not (Test-Path "release/Cairn-Setup-$v.exe")) { throw "installer missing" }
