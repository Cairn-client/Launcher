[package]
name = "cairn-launcher"
description = "The Cairn launcher: a native window that turns single-player games into shared ones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cairn_launcher"
path = "src/lib.rs"

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-protocol = { path = "../cairn-protocol" }
cairn-setup = { path = "../cairn-setup" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
regex.workspace = true
zip.workspace = true
sha2.workspace = true
unicode-normalization = "0.1"
rfd.workspace = true
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[dev-dependencies]
cairn-setup = { path = "../cairn-setup", features = ["test-support"] }

[build-dependencies]
winresource = "0.1"
